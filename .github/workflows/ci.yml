name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  companion:
    name: Companion (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache-dependency-path: companion/go.sum

      - name: Verify gofmt
        working-directory: companion
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        working-directory: companion
        run: go vet ./...

      - name: Test
        working-directory: companion
        run: go test -race ./...

      - name: Build
        working-directory: companion
        run: go build ./...

  app:
    name: App (Android, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [Universal, LegacyPhone]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android/build-cache
            KJBMail/.gradle
            vendor/termux-app/.gradle
          key: gradle-${{ runner.os }}-${{ matrix.variant }}-${{ hashFiles('KJBMail/**/*.gradle*', 'KJBMail/**/*.gradle.kts', 'KJBMail/gradle/*.toml', 'app/**/*.gradle*', 'app/gradle/wrapper/gradle-wrapper.properties', 'app/gradle/libs.versions.toml', 'vendor/**/*.gradle*', 'vendor/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests + debug build (${{ matrix.variant }})
        working-directory: app
        run: |
          : "JAVA_HOME=${JAVA_HOME:?setup-java did not provide JAVA_HOME}"
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?setup-android did not provide an SDK path}}"
          ./gradlew --no-daemon \
            :app:test${{ matrix.variant }}DebugUnitTest \
            :app:assemble${{ matrix.variant }}Debug

      - name: Verify installer policy mock suite
        run: scripts/test-installer-policy.sh

  embedded-herdr:
    name: Embedded Herdr sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - uses: actions/setup-go@v7
        with:
          go-version-file: embedded/herdr-mobile-relay/go.mod
          cache-dependency-path: embedded/herdr-mobile-relay/go.sum
      - name: Verify frontend and generated Android assets
        run: |
          scripts/sync-embedded-herdr.sh
          git diff --exit-code -- app/app/src/main/assets/herdr
          test -z "$(git status --porcelain --untracked-files=all -- app/app/src/main/assets/herdr)"
      - name: Test and build relay
        working-directory: embedded/herdr-mobile-relay
        run: |
          go test ./...
          mkdir -p bin
          go build -o bin/herdr-mobile-relay ./cmd/herdr-mobile-relay
